    <!-- Modular Sections Loader -->
    <script>
        async function loadSections() {
            const placeholders = Array.from(document.querySelectorAll('[data-include]'));
            await Promise.all(placeholders.map(async (el) => {
                const url = el.getAttribute('data-include');
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const content = await response.text();
                    el.insertAdjacentHTML('beforebegin', content);
                    el.remove();
                } catch (err) {
                    console.error('Failed to load section:', url, err);
                    if (window.location.protocol === 'file:') {
                        el.innerHTML = `<div style="padding:15px; color:#ff4444; background:#222; text-align:center;">
                            Note: Opening via file:// blocks HTML includes in modern browsers. Please view with a local server (e.g. VS Code Live Server) or on GitHub Pages.
                        </div>`;
                    }
                }
            }));

            // Initialize rotating text headline after sections are rendered in DOM
            if (window.initCdHeadline) {
                window.initCdHeadline();
            }

            // Replace feather icons for all dynamically loaded sections
            if (window.feather) {
                feather.replace();
            }

            // Dynamically load main.js after all section DOM elements are rendered
            const mainScript = document.createElement('script');
            mainScript.src = 'assets/js/main.js';
            document.body.appendChild(mainScript);
        }
        document.addEventListener('DOMContentLoaded', loadSections);

        // Ensure any external link or document clicked opens in a new tab
        document.addEventListener('click', function (e) {
            const link = e.target.closest('a');
            if (!link) return;
            const href = link.getAttribute('href');
            if (!href || href === '#' || href.startsWith('#') || href.startsWith('javascript:')) {
                return;
            }
            if (href.startsWith('http://') || href.startsWith('https://') || href.endsWith('.pdf')) {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            }
        }, { passive: true });
    </script>
