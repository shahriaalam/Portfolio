    <!-- Modular Sections Loader -->
    <script>
        async function loadSections() {
            const placeholders = Array.from(document.querySelectorAll('[data-include]'));
            if (placeholders.length === 0) {
                initPageScripts();
                return;
            }

            await Promise.all(placeholders.map(async (el) => {
                const url = el.getAttribute('data-include');
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const content = await response.text();
                    el.insertAdjacentHTML('beforebegin', content);
                    el.remove();
                } catch (err) {
                    console.error('Failed to load section:', url, err);
                }
            }));

            initPageScripts();
        }

        function initPageScripts() {
            if (window.feather) {
                feather.replace();
            }
            if (window.initCdHeadline) {
                window.initCdHeadline();
            }
            if (!document.getElementById('main-script')) {
                const mainScript = document.createElement('script');
                mainScript.id = 'main-script';
                mainScript.src = 'assets/js/main.js';
                mainScript.onload = function () {
                    if (window.AOS) {
                        AOS.refreshHard();
                    }
                };
                document.body.appendChild(mainScript);
            }
        }

        document.addEventListener('DOMContentLoaded', loadSections);

        // Ensure any external link or document clicked opens in a new tab
        document.addEventListener('click', function (e) {
            const link = e.target.closest('a');
            if (!link) return;
            const href = link.getAttribute('href');
            if (!href || href === '#' || href.startsWith('#') || href.startsWith('javascript:')) {
                return;
            }
            if (href.startsWith('http://') || href.startsWith('https://') || href.endsWith('.pdf')) {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            }
        }, { passive: true });
    </script>
